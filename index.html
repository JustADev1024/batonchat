<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Чат (ручной)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            padding: 20px;
            max-width: 700px;
            margin: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            text-align: center;
            font-weight: 400;
            margin-bottom: 20px;
            color: #a5b4fc;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        input, textarea, button {
            background: #334155;
            border: none;
            border-radius: 8px;
            color: #f1f5f9;
            padding: 10px 14px;
            font-size: 15px;
            flex: 1;
            min-width: 100px;
        }
        input:focus, textarea:focus {
            outline: 2px solid #6366f1;
        }
        button {
            background: #6366f1;
            color: white;
            font-weight: 600;
            cursor: pointer;
            flex: 0 0 auto;
            transition: background 0.2s;
        }
        button:hover {
            background: #4f46e5;
        }
        button.secondary {
            background: #475569;
        }
        button.secondary:hover {
            background: #64748b;
        }
        textarea {
            width: 100%;
            height: 100px;
            resize: vertical;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        #messages {
            background: #0f172a;
            border-radius: 12px;
            padding: 12px;
            height: 300px;
            overflow-y: auto;
            border: 1px solid #334155;
            margin: 10px 0;
        }
        .msg {
            padding: 6px 12px;
            margin: 4px 0;
            border-radius: 8px;
            background: #1e293b;
        }
        .msg.me {
            background: #312e81;
            text-align: right;
        }
        .status {
            font-size: 14px;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .status.online { background: #22c55e; color: #052e16; }
        .status.offline { background: #ef4444; color: #450a0a; }
        .status.waiting { background: #eab308; color: #451a03; }
        hr {
            border: 0;
            border-top: 1px solid #334155;
            margin: 12px 0;
        }
        .label {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 4px;
            display: block;
        }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

<h1>📡 P2P Чат (ручной обмен SDP)</h1>

<!-- 1. Настройка -->
<div class="card">
    <div class="row">
        <input type="text" id="myName" placeholder="Ваше имя" value="Алиса">
        <button id="createOfferBtn" class="primary">📤 Создать Offer</button>
        <button id="resetBtn" class="secondary">⟳ Сбросить</button>
    </div>
    <div style="margin-top: 10px;">
        <span id="statusBadge" class="status waiting">⏳ Ожидание</span>
    </div>
</div>

<!-- 2. Обмен SDP -->
<div class="card">
    <div class="flex">
        <div style="flex:1;">
            <span class="label">📤 Ваш SDP (скопируйте и отправьте собеседнику)</span>
            <textarea id="localSDP" placeholder="Здесь появится ваш SDP..."></textarea>
        </div>
        <div style="flex:1;">
            <span class="label">📥 SDP собеседника (вставьте сюда)</span>
            <textarea id="remoteSDP" placeholder="Вставьте SDP, полученный от собеседника..."></textarea>
            <button id="applyRemoteBtn" style="width:100%; margin-top:8px;">Применить SDP собеседника</button>
        </div>
    </div>
</div>

<!-- 3. Чат -->
<div class="card" style="flex:1;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>💬 Сообщения</span>
        <span id="connStatus" style="font-size:14px; color:#94a3b8;">Не подключено</span>
    </div>
    <div id="messages"></div>
    <div class="row">
        <input type="text" id="msgInput" placeholder="Введите сообщение..." disabled>
        <button id="sendBtn" disabled>➤</button>
    </div>
</div>

<script>
    // ----- Конфигурация -----
    const ICE_SERVERS = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun.voip.mail.ru:3478' },
            { urls: 'stun:stun.sipnet.ru:3478' }
        ]
    };

    // ----- Состояние -----
    let pc = null;
    let dataChannel = null;
    let isOfferer = false;
    let myName = '';

    // DOM
    const localSDP = document.getElementById('localSDP');
    const remoteSDP = document.getElementById('remoteSDP');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusBadge = document.getElementById('statusBadge');
    const connStatus = document.getElementById('connStatus');
    const myNameInput = document.getElementById('myName');

    // ----- Вспомогательные функции -----
    function setStatus(text, type = 'waiting') {
        statusBadge.textContent = text;
        statusBadge.className = 'status ' + type;
    }

    function addMessage(text, isMe = false) {
        const div = document.createElement('div');
        div.className = 'msg' + (isMe ? ' me' : '');
        div.textContent = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateLocalSDP() {
        if (pc && pc.localDescription) {
            localSDP.value = pc.localDescription.sdp;
        }
    }

    // ----- Создание PeerConnection -----
    function createPeerConnection() {
        if (pc) {
            pc.close();
        }
        pc = new RTCPeerConnection(ICE_SERVERS);

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                updateLocalSDP();
            }
        };

        pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            if (state === 'connected' || state === 'completed') {
                setStatus('🔗 Соединение установлено', 'online');
                connStatus.textContent = '✅ Подключено';
                msgInput.disabled = false;
                sendBtn.disabled = false;
            } else if (state === 'disconnected' || state === 'failed') {
                setStatus('❌ Соединение разорвано', 'offline');
                connStatus.textContent = '❌ Разрыв';
                msgInput.disabled = true;
                sendBtn.disabled = true;
            } else {
                connStatus.textContent = '⏳ ' + state;
            }
        };

        return pc;
    }

    // ----- Настройка канала данных -----
    function setupDataChannel(channel) {
        dataChannel = channel;
        dataChannel.onopen = () => {
            addMessage('🔗 Канал данных открыт!', false);
            setStatus('🔗 Соединение установлено', 'online');
            connStatus.textContent = '✅ Подключено';
            msgInput.disabled = false;
            sendBtn.disabled = false;
        };
        dataChannel.onclose = () => {
            addMessage('❌ Канал данных закрыт', false);
            setStatus('❌ Соединение разорвано', 'offline');
            connStatus.textContent = '❌ Разрыв';
            msgInput.disabled = true;
            sendBtn.disabled = true;
        };
        dataChannel.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                addMessage(`${data.name}: ${data.text}`, false);
            } catch {
                addMessage(`❓ ${e.data}`, false);
            }
        };
    }

    // ----- Отправка сообщения -----
    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        if (!dataChannel || dataChannel.readyState !== 'open') {
            alert('Канал не открыт');
            return;
        }
        dataChannel.send(JSON.stringify({ name: myName, text }));
        addMessage(`${myName}: ${text}`, true);
        msgInput.value = '';
        msgInput.focus();
    }

    // ----- Сброс -----
    function resetAll() {
        if (pc) {
            pc.close();
            pc = null;
        }
        dataChannel = null;
        isOfferer = false;
        localSDP.value = '';
        remoteSDP.value = '';
        messagesDiv.innerHTML = '';
        msgInput.disabled = true;
        sendBtn.disabled = true;
        setStatus('⏳ Ожидание', 'waiting');
        connStatus.textContent = 'Не подключено';
        addMessage('🔄 Сброшено. Начните заново.', false);
    }

    // ----- Очистка SDP от нестандартных строк -----
    function cleanSDP(sdp) {
        const lines = sdp.split('\n');
        const filtered = lines.filter(line => {
            const trimmed = line.trim();
            // Удаляем строки, которые могут сломать парсер
            if (trimmed.startsWith('a=max-message-size')) return false;
            if (trimmed.startsWith('a=scpt-port')) return false;
            // Можно добавить другие известные нестандартные атрибуты
            return true;
        });
        return filtered.join('\n');
    }

    // ----- Создать Offer -----
    document.getElementById('createOfferBtn').onclick = async () => {
        myName = myNameInput.value.trim() || 'Аноним';
        resetAll();

        pc = createPeerConnection();
        dataChannel = pc.createDataChannel('chat');
        setupDataChannel(dataChannel);
        isOfferer = true;

        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            updateLocalSDP();
            setStatus('📤 Offer создан, скопируйте и передайте собеседнику', 'waiting');
            connStatus.textContent = 'Ожидание ответа';
            addMessage('📤 Отправьте ваш SDP собеседнику.', false);
        } catch (err) {
            alert('Ошибка создания offer: ' + err.message);
        }
    };

    // ----- Применить SDP собеседника -----
    document.getElementById('applyRemoteBtn').onclick = async () => {
        let rawSDP = remoteSDP.value.trim();
        if (!rawSDP) {
            alert('Вставьте SDP от собеседника');
            return;
        }

        // Очищаем от нестандартных строк
        const cleanedSDP = cleanSDP(rawSDP);
        if (cleanedSDP !== rawSDP) {
            remoteSDP.value = cleanedSDP;
            alert('⚠️ Из SDP были удалены нестандартные строки (например, a=max-message-size). Попробуйте снова.');
            return; // просим пользователя нажать ещё раз (теперь с очищенным)
        }

        if (!pc) {
            // Мы ещё не создали PeerConnection, значит будем отвечать на offer
            myName = myNameInput.value.trim() || 'Аноним';
            pc = createPeerConnection();
            pc.ondatachannel = (event) => {
                setupDataChannel(event.channel);
            };
            isOfferer = false;
        }

        try {
            const type = isOfferer ? 'answer' : 'offer';
            await pc.setRemoteDescription({ type: type, sdp: cleanedSDP });
            setStatus('✅ Удалённое описание установлено', 'waiting');
            connStatus.textContent = 'Ожидание подключения...';

            if (!isOfferer) {
                // Мы ответчик — создаём answer
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                updateLocalSDP();
                addMessage('📤 Ответ создан, отправьте его собеседнику.', false);
                setStatus('📤 Ответ создан, скопируйте и отправьте', 'waiting');
            } else {
                addMessage('✅ Ответ применён, ожидаем соединения...', false);
            }
        } catch (err) {
            alert('Ошибка применения SDP: ' + err.message);
        }
    };

    // ----- Отправка -----
    sendBtn.onclick = sendMessage;
    msgInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

    // ----- Сброс -----
    document.getElementById('resetBtn').onclick = resetAll;

    // Стартовое сообщение
    addMessage('👋 Добро пожаловать! Нажмите "Создать Offer" (вы первый) или вставьте SDP собеседника, если вам прислали offer.', false);
</script>

</body>
</html>
